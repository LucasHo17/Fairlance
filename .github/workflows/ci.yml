name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: Vitest ──────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

  # ── ML service: pytest ────────────────────────────────────────
  test-ml:
    name: ML Service Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ml-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ml-service
        run: python -m pytest tests/ -v
        env:
          # ML tests are self-contained — no real Supabase connection needed.
          # Provide stubs so any os.getenv() calls don't blow up.
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test-key
          ALLOWED_ORIGINS: http://localhost:5173
